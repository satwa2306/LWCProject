<template>

    <lightning-card  title="Two way binding">
    
    <div class="slds-var-m-around_medium">
    <!-- <h1>{fullname}-{city.city}</h1> --> 
    <lightning-input type="text" label="Enter Name" onkeyup={changeHandler}></lightning-input>
     <div>{fullname} the cousre is {title}</div>
     </div>
    </lightning-card>

    <lightning-card  title="@track properties">
    <div class="slds-var-m-around_medium">
  
    <lightning-input type="text" label="Enter Name" onkeyup={trackHandler}></lightning-input>
     <div>{fullname} the cousre is {obj.city}</div>
     </div>
    </lightning-card>

    
    <lightning-card  title="getter properties">
    <div class="slds-var-m-around_medium">
    
    <lightning-input type="text" label="Enter Name" onkeyup={getproperties}></lightning-input>
     <div>{num1} and {num2} multipy {user}</div>
     </div>
    </lightning-card>



   
    
</template>
