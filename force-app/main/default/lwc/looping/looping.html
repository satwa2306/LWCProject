<template>
    <lightning-card title="Looping for each">
        <ul class="slds-has-dividers_around-space">
            <template for:each={cars} for:item="car">
                <li class="slds-item" key={car}>
                    {car}
                </li>
            </template>
        </ul>
    </lightning-card>

   <lightning-card title="Looping Iterator">
    <div class="slds-var-m-around_medium">

        <template iterator:ceo={ceoList}>

            <li key={ceo.value.id} class="slds-list_vertical slds-var-m-bottom_small "  style="list-style: none;">

                <!-- First item -->
                <template if:true={ceo.first}>
                    <div class="slds-box slds-theme_shade slds-var-m-bottom_small">
                        <strong>List of companies</strong>
                    </div>
                </template>

                <!-- Company -->
                <div class="slds-box">
                    <strong>{ceo.value.name}</strong> - {ceo.value.company}
                </div>

                <!-- Last item -->
                <template if:true={ceo.last}>
                    <div class="slds-box slds-theme_shade slds-var-m-top_small">
                        <strong>Thanks for reading the list</strong>
                    </div>
                </template>

            </li>

        </template>

    </div>
</lightning-card>
</template>
